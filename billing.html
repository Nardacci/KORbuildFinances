<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KORbuild Finances · Assinatura</title>
<link rel="stylesheet" href="billing.css?v=1.1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</head>
<body data-ai-assistant="off">
<div class="billing-shell">
  <header class="topbar">
    <div><strong>KORbuild Finances</strong><small>Assinatura</small></div>
    <div class="user-menu-wrap">
      <button id="user-menu-btn" class="user-menu-btn" type="button" aria-expanded="false">
        <span class="avatar" id="user-avatar">A</span>
        <span class="user-copy"><strong id="user-name">—</strong><small id="user-email"></small></span>
      </button>
      <div id="user-menu" class="user-menu hidden">
        <div class="menu-header"><span class="avatar" id="menu-avatar">A</span><div><b id="menu-full-name">—</b><small id="menu-full-email"></small></div></div>
        <div class="menu-divider"></div>
        <button class="menu-item danger" id="logout" type="button">↪ <span>Sair</span></button>
      </div>
    </div>
  </header>

  <section class="intro">
    <div class="eyebrow">SUA ASSINATURA</div>
    <h1>Acesso ao KORbuild Finances</h1>
    <p id="billing-subtitle">Confira o status do seu workspace.</p>
  </section>

  <section id="status-card" class="status-card loading">
    <div class="status-icon" id="status-icon">◷</div>
    <div class="status-copy">
      <small id="status-eyebrow">VERIFICANDO</small>
      <strong id="status-title">Carregando o status da sua assinatura...</strong>
      <p id="status-message">Aguarde um instante.</p>
    </div>
    <div class="status-metric"><strong id="status-days">—</strong><span id="status-days-label"></span></div>
  </section>

  <section id="payment-card" class="payment-card hidden">
    <div class="payment-card-head">
      <strong id="payment-card-title">Regularize sua assinatura</strong>
      <p id="payment-card-intro"></p>
    </div>
    <div class="price-block">
      <strong id="price-amount">—</strong>
      <p id="price-note"></p>
    </div>
    <div class="payment-details">
      <div class="payment-row"><small>Método</small><strong id="payment-method-value">—</strong></div>
      <div class="payment-row"><small>Titular</small><strong id="payment-account-holder-value">—</strong></div>
      <div class="payment-row"><small>Banco</small><strong id="payment-bank-value">—</strong></div>
      <div class="payment-row payment-row-key"><small>Chave Pix</small><div class="payment-key"><code id="payment-key-value">—</code><button id="copy-payment-key" type="button">Copiar</button></div></div>
    </div>
    <p id="payment-instructions-text" class="payment-instructions-text"></p>
    <p id="payment-contact-value" class="payment-contact"></p>
  </section>

  <div id="status" class="error-note hidden" role="alert"></div>
</div>
<script src="billing.js?v=1.1.0"></script>
</body>
</html>
