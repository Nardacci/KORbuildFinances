<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KORbuild Finances · Editar transferência</title><link rel="stylesheet" href="dashboard.css?v=5.2.0"><link rel="stylesheet" href="expenses.css?v=1.0.0"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script></head><body><div class="app-shell"><aside class="sidebar"></aside><main class="main-content"><header class="topbar"><div class="page-context"><strong>Editar transferência</strong><small>Atualize os dados da movimentação.</small></div></header><section class="intro"><div class="eyebrow">MOVIMENTAÇÃO</div><h1>Editar transferência</h1><p>De onde saiu → para onde foi → quanto → pronto.</p></section><form id="transfer-form" class="form-card"><div class="form-grid"><div class="field"><label for="source">Conta de origem</label><select id="source" required><option value="">Selecione...</option></select></div><div class="field"><label for="destination">Conta de destino</label><select id="destination" required><option value="">Selecione...</option></select></div><div class="field"><label for="source-amount">Valor que saiu</label><input id="source-amount" required inputmode="decimal" placeholder="0,00"></div><div class="field"><label for="destination-amount">Valor que entrou</label><input id="destination-amount" required inputmode="decimal" placeholder="0,00"></div><div class="field"><label for="date">Data</label><input id="date" type="date" required></div><div class="field"><label for="description">Descrição</label><input id="description" maxlength="160" placeholder="Ex.: Envio para conta no Brasil"></div><div class="field full"><div id="currency-info" class="form-note">Selecione as contas para verificar as moedas.</div></div></div><div class="form-actions"><a class="secondary-action" href="transfers.html">Cancelar</a><button class="primary-action" type="submit">Salvar alterações</button></div><div id="form-status" class="status hidden"></div></form></main><div class="app-version">KORbuild Finances V2.3.2 · Development environment</div></div><script src="transfer-edit.js?v=1.1.0"></script></body></html>
