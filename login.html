<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KORbuild Finances — Acesso</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{height:100%;margin:0;overflow:hidden}body{background:#f6f8fb}.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.login-card{width:min(430px,100%);background:#fff;border:1px solid #e5e9f0;border-radius:20px;padding:38px;box-shadow:0 18px 50px rgba(20,30,50,.08)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}.brand-mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#16845b;color:#fff;font-weight:800;font-size:22px}.brand strong{display:block;font-size:19px}.brand span{display:block;color:#718096;font-size:13px;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:700;color:#16845b;margin-bottom:9px}.login-card h1{margin:0 0 9px;font-size:29px;color:#172033}.lead{margin:0 0 25px;color:#667085;line-height:1.5}.field{display:block;margin-bottom:17px;font-weight:700;font-size:13px;color:#344054}.field input{display:block;width:100%;box-sizing:border-box;margin-top:7px;border:1px solid #d8dee8;border-radius:10px;padding:13px 14px;font-size:15px;outline:none}.field input:focus{border-color:#16845b;box-shadow:0 0 0 3px rgba(22,132,91,.12)}.primary{width:100%;border:0;border-radius:10px;padding:14px 16px;background:#16845b;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.primary:disabled{opacity:.5;cursor:not-allowed}.error{min-height:20px;color:#c0392b;font-size:13px;margin:8px 0 4px}.success{min-height:20px;color:#16845b;font-size:13px;margin:8px 0 4px}.switch{margin-top:18px;text-align:center;color:#667085;font-size:13px}.switch button{border:0;background:none;color:#16845b;font-weight:700;cursor:pointer}.demo{margin-top:18px;padding:12px 14px;background:#f7f8fa;border-radius:10px;color:#667085;font-size:12px;line-height:1.45}@media(max-width:520px){.login-card{padding:28px 22px}}</style>
</head><body><main class="login-page"><section class="login-card"><div class="brand"><div class="brand-mark">K</div><div><strong>KORbuild Finances</strong><span>Seu patrimônio. Seu futuro. Em construção.</span></div></div><div class="eyebrow" id="modeLabel">ACESSO</div><h1 id="title">Bem-vindo de volta</h1><p class="lead" id="lead">Entre para continuar sua jornada de construção de patrimônio.</p><form id="authForm"><label class="field">E-mail<input id="email" type="email" autocomplete="email" placeholder="voce@email.com" required></label><label class="field">Senha<input id="password" type="password" autocomplete="current-password" placeholder="Sua senha" required minlength="6"></label><div id="error" class="error" role="alert"></div><div id="success" class="success" role="status"></div><button id="submitBtn" class="primary" type="submit">Entrar →</button></form><div class="switch"><span id="switchText">Ainda não tem uma conta?</span> <button id="switchBtn" type="button">Cadastre-se</button></div><div class="demo">Acesso seguro por Supabase Auth. A senha é tratada pelo provedor de autenticação.</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>
const form=document.getElementById('authForm'),btn=document.getElementById('submitBtn'),error=document.getElementById('error'),success=document.getElementById('success'),switchBtn=document.getElementById('switchBtn');let signupMode=false;function render(){signupMode=!signupMode;document.getElementById('modeLabel').textContent=signupMode?'NOVO ACESSO':'ACESSO';document.getElementById('title').textContent=signupMode?'Crie sua conta':'Bem-vindo de volta';document.getElementById('lead').textContent=signupMode?'Comece sua jornada de construção de patrimônio.':'Entre para continuar sua jornada de construção de patrimônio.';btn.textContent=signupMode?'Criar minha conta →':'Entrar →';document.getElementById('switchText').textContent=signupMode?'Já possui uma conta?':'Ainda não tem uma conta?';switchBtn.textContent=signupMode?'Entrar':'Cadastre-se';error.textContent='';success.textContent=''}switchBtn.addEventListener('click',render);form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';success.textContent='';if(!form.reportValidity())return;btn.disabled=true;btn.textContent=signupMode?'Criando…':'Entrando…';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,result=signupMode?await KORbuildAuth.signup(email,password):await KORbuildAuth.login(email,password);if(result.error)throw result.error;if(signupMode){if(result.data.session)window.location.replace('index.html');else{success.textContent='Conta criada. Verifique seu e-mail para confirmar o acesso.';form.reset()}}else window.location.replace('index.html')}catch(err){error.textContent=err.message||'Não foi possível concluir o acesso.'}finally{btn.disabled=false;btn.textContent=signupMode?'Criar minha conta →':'Entrar →'}});(async()=>{try{if(await KORbuildAuth.session())window.location.replace('index.html')}catch(e){console.error(e)}})();
</script></body></html>
